<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
  <rect width="1280" height="540" rx="20" fill="#0B0F1A"/>
  <line x1="640" y1="50" x2="640" y2="490" stroke="#1C2438" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="70" font-size="26" font-weight="700" fill="#E8ECF4">Plain fan-out</text>
    <text x="60" y="100" font-size="17" fill="#8A93A6">5 agents, 1 answer</text>
    <text x="700" y="70" font-size="26" font-weight="700" fill="#E8ECF4">nash</text>
    <text x="700" y="100" font-size="17" fill="#8A93A6">5 agents, 5 answers, then a tournament</text>
  </g>

  <!-- left: everyone converges on the focal point -->
  <g stroke="#3A4560" stroke-width="2.5" fill="none">
    <path d="M128 160 C 300 160, 330 300, 436 300"/>
    <path d="M128 230 C 300 230, 330 300, 436 300"/>
    <path d="M128 300 L 436 300"/>
    <path d="M128 370 C 300 370, 330 300, 436 300"/>
    <path d="M128 440 C 300 440, 330 300, 436 300"/>
  </g>
  <g fill="#1A2236" stroke="#5B6478" stroke-width="2">
    <circle cx="110" cy="160" r="18"/><circle cx="110" cy="230" r="18"/><circle cx="110" cy="300" r="18"/>
    <circle cx="110" cy="370" r="18"/><circle cx="110" cy="440" r="18"/>
  </g>
  <circle cx="470" cy="300" r="34" fill="#2A1618" stroke="#E5534B" stroke-width="2.5"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="470" y="307" font-size="20" font-weight="700" fill="#E5534B">×5</text>
    <text x="470" y="365" font-size="16" fill="#B8C0D0">"Redis cache +</text>
    <text x="470" y="386" font-size="16" fill="#B8C0D0">stale-while-revalidate"</text>
  </g>

  <!-- right: assigned niches spread the agents out -->
  <g stroke-width="2.5" fill="none">
    <path d="M768 160 L 930 160" stroke="#F5B841"/>
    <path d="M768 230 L 930 230" stroke="#3DD6C4"/>
    <path d="M768 300 L 930 300" stroke="#3DD6C4"/>
    <path d="M768 370 L 930 370" stroke="#3DD6C4"/>
    <path d="M768 440 L 930 440" stroke="#3DD6C4"/>
  </g>
  <g fill="#1A2236" stroke="#5B6478" stroke-width="2">
    <circle cx="750" cy="160" r="18"/><circle cx="750" cy="230" r="18"/><circle cx="750" cy="300" r="18"/>
    <circle cx="750" cy="370" r="18"/><circle cx="750" cy="440" r="18"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">
    <rect x="938" y="140" width="290" height="40" rx="8" fill="#2A2210" stroke="#F5B841"/>
    <text x="954" y="166" fill="#F5B841">Anchor · cached snapshot</text>
    <rect x="938" y="210" width="290" height="40" rx="8" fill="#10221F" stroke="#3DD6C4"/>
    <text x="954" y="236" fill="#E8ECF4">Trace &amp; fix the slow services</text>
    <rect x="938" y="280" width="290" height="40" rx="8" fill="#10221F" stroke="#3DD6C4"/>
    <text x="954" y="306" fill="#E8ECF4">Event-fed read model</text>
    <rect x="938" y="350" width="290" height="40" rx="8" fill="#10221F" stroke="#3DD6C4"/>
    <text x="954" y="376" fill="#E8ECF4">Lazy per-widget loading</text>
    <rect x="938" y="420" width="290" height="40" rx="8" fill="#10221F" stroke="#3DD6C4"/>
    <text x="954" y="446" fill="#E8ECF4">Push alerts, skip the page</text>
  </g>
  <text x="640" y="520" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6478">Same model, same problem: "the dashboard takes 8s, aggregating 6 microservices"</text>
</svg>
