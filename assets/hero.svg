<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#121A2B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1C2438" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)" opacity="0.6"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="170" font-size="132" font-weight="800" fill="#E8ECF4" letter-spacing="-4">nash</text>
    <circle cx="398" cy="160" r="11" fill="#F5B841"/>
    <text x="84" y="222" font-size="30" font-weight="600" fill="#E8ECF4">A game-theory dev team for your agents.</text>
    <text x="84" y="262" font-size="21" fill="#8A93A6">Parallel agents that compete instead of herd.</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#E8ECF4">
    <rect x="84"  y="306" width="148" height="40" rx="20" fill="#1A2236" stroke="#2B3550"/>
    <text x="158" y="331" text-anchor="middle">/nash:decide</text>
    <rect x="244" y="306" width="148" height="40" rx="20" fill="#1A2236" stroke="#2B3550"/>
    <text x="318" y="331" text-anchor="middle">/nash:review</text>
    <rect x="404" y="306" width="140" height="40" rx="20" fill="#1A2236" stroke="#2B3550"/>
    <text x="474" y="331" text-anchor="middle">/nash:debug</text>
    <rect x="556" y="306" width="128" height="40" rx="20" fill="#1A2236" stroke="#2B3550"/>
    <text x="620" y="331" text-anchor="middle">/nash:test</text>
    <rect x="696" y="306" width="128" height="40" rx="20" fill="#1A2236" stroke="#2B3550"/>
    <text x="760" y="331" text-anchor="middle">/nash:loop</text>
  </g>

  <!-- payoff matrix: the herd's cell pays nothing; the equilibrium is highlighted -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="1020" y="78" font-size="15" fill="#8A93A6" letter-spacing="2">AGENT B</text>
    <text x="952" y="112" font-size="15" fill="#8A93A6">obvious</text>
    <text x="1088" y="112" font-size="15" fill="#8A93A6">distinct</text>
    <text x="842" y="256" font-size="15" fill="#8A93A6" letter-spacing="2" transform="rotate(-90 842 256)">AGENT A</text>
    <text x="874" y="188" font-size="15" fill="#8A93A6" transform="rotate(-90 874 188)">obvious</text>
    <text x="874" y="324" font-size="15" fill="#8A93A6" transform="rotate(-90 874 324)">distinct</text>

    <rect x="890"  y="126" width="124" height="124" rx="10" fill="#161D2E" stroke="#2B3550"/>
    <text x="952" y="196" font-size="28" font-weight="700" fill="#5B6478">0 , 0</text>
    <text x="952" y="224" font-size="13" fill="#5B6478">the herd</text>

    <rect x="1026" y="126" width="124" height="124" rx="10" fill="#161D2E" stroke="#2B3550"/>
    <text x="1088" y="196" font-size="28" font-weight="700" fill="#B8C0D0">1 , 3</text>

    <rect x="890"  y="262" width="124" height="124" rx="10" fill="#161D2E" stroke="#2B3550"/>
    <text x="952" y="332" font-size="28" font-weight="700" fill="#B8C0D0">3 , 1</text>

    <rect x="1026" y="262" width="124" height="124" rx="10" fill="#2A2210" stroke="#F5B841" stroke-width="2.5"/>
    <text x="1088" y="332" font-size="28" font-weight="700" fill="#F5B841">4 , 4</text>
    <text x="1088" y="360" font-size="13" fill="#F5B841">equilibrium</text>
  </g>
</svg>
